<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Proverb Game</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f5f7fb;color:#172033}
#app{min-height:100vh;width:100%;padding:clamp(18px,4vw,64px)}.login{width:100%;min-height:calc(100vh - clamp(36px,8vw,128px));display:flex;flex-direction:column;justify-content:center;max-width:none;margin:0;background:white;padding:clamp(32px,8vw,110px);border-radius:30px;box-shadow:0 15px 50px #17203314}.login h1{font-size:clamp(48px,7vw,96px);margin-bottom:42px}.login input{font-size:clamp(18px,2vw,24px);padding:20px 22px;margin:9px 0}.login .primary{font-size:clamp(18px,2vw,24px);padding:20px;margin-top:8px}
h1{font-size:clamp(30px,4vw,54px);margin:0 0 26px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.stat,.panel{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px #1720330d}.stat b{display:block;font-size:28px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}
button,input{font:inherit;border:1px solid #dce1ec;border-radius:13px;padding:14px 16px}button{background:#fff;cursor:pointer}.primary{background:#3149db;color:#fff;border:0;font-weight:800}input{width:100%;margin:7px 0}
.question{font-size:clamp(24px,3vw,38px);font-weight:850;margin:28px 0}.choice{display:block;width:100%;text-align:left;margin:9px 0;font-size:17px}.good{background:#def7e7}.bad{background:#ffe1e1}
.feedback{padding:18px;background:#eef1ff;border-radius:15px;margin:16px 0;line-height:1.6}.hide{display:none}.tablewrap{overflow:auto;background:#fff;border-radius:20px;padding:12px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:15px;border-bottom:1px solid #e8ebf2;text-align:center}
.note{padding:15px 0;border-bottom:1px solid #e8ebf2}.muted{color:#737b8c}.layer{position:fixed;inset:0;background:#111827f4;color:white;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.tokens{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px}.built{min-height:65px;border:2px dashed #ffffff77;border-radius:15px;padding:18px}
@media(max-width:760px){#app{padding:14px}.grid{grid-template-columns:1fr 1fr}.login{min-height:calc(100vh - 28px);padding:28px 20px;border-radius:22px}.login h1{font-size:44px;margin-bottom:28px}.actions>*{flex:1}.top{align-items:flex-start}}
</style></head><body><main id="app"></main><div id="overlay"></div>
<script>
const BANK=[{"id":1,"en":"No pain, no gain.","ko":"고생 없이는 얻는 것도 없다.","key":"고생(pain)을 해야 얻는 것(gain)이 생긴다고 연결."},{"id":2,"en":"Haste makes waste.","ko":"급할수록 일을 그르친다.","key":"서두름(haste)이 낭비(waste)를 만든다고 원인→결과로 기억."},{"id":3,"en":"Easy come, easy go.","ko":"쉽게 얻은 것은 쉽게 잃는다.","key":"쉽게 오면(come) 쉽게 간다(go)는 같은 구조."},{"id":4,"en":"Ignorance is bliss.","ko":"모르는 게 약이다.","key":"모르면(ignorance) 오히려 마음이 편하다(bliss)는 반전."},{"id":5,"en":"Knowledge is power.","ko":"아는 것이 힘이다.","key":"아는 것(knowledge) 자체가 힘(power)이 된다고 그대로 연결."},{"id":6,"en":"Old habits die hard.","ko":"오랜 습관은 고치기 어렵다.","key":"Old habits die — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":7,"en":"Look before you leap.","ko":"행동하기 전에 신중히 생각하라.","key":"뛰기(leap) 전에 먼저 살핀다(look)는 행동 순서."},{"id":8,"en":"No news is good news.","ko":"소식이 없는 것이 좋은 소식이다.","key":"나쁜 소식조차 없으니 no news를 good news로 연결."},{"id":9,"en":"Bad news travels fast.","ko":"나쁜 소식은 빨리 퍼진다.","key":"Bad news travels — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":10,"en":"It takes two to tango.","ko":"어떤 일에는 양쪽 모두 책임이 있다.","key":"탱고(tango)는 두 사람이 춰야 하니 양쪽이 필요."},{"id":11,"en":"Like father, like son.","ko":"그 아버지에 그 아들.","key":"Like father like — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":12,"en":"Still waters run deep.","ko":"조용한 사람이 속이 깊다.","key":"잔잔한 물(still waters)이 오히려 깊다(deep)는 장면."},{"id":13,"en":"Time heals all wounds.","ko":"시간이 모든 상처를 치유한다.","key":"Time heals all — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":14,"en":"You reap what you sow.","ko":"뿌린 대로 거둔다.","key":"먼저 sow(씨를 뿌리고) 나중에 reap(거둔다)는 순서."},{"id":15,"en":"Better late than never.","ko":"늦더라도 안 하는 것보다 낫다.","key":"늦게(late)라도 아예 안 하는 것(never)보다 낫다고 비교."},{"id":16,"en":"History repeats itself.","ko":"역사는 반복된다.","key":"History repeats itself — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":17,"en":"Let bygones be bygones.","ko":"지난 일은 잊어버리자.","key":"Let bygones be — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":18,"en":"Practice makes perfect.","ko":"연습이 완벽을 만든다.","key":"연습(practice)이 완벽(perfect)을 만든다는 원인→결과."},{"id":19,"en":"Fortune favors the bold.","ko":"행운은 용기 있는 사람의 편이다.","key":"Fortune favors the — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":20,"en":"Measure twice, cut once.","ko":"신중히 확인한 후 행동하라.","key":"자르기(cut)는 되돌리기 어려우니 두 번 재고(measure) 한 번 자름."},{"id":21,"en":"Barking dogs seldom bite.","ko":"짖는 개는 잘 물지 않는다.","key":"Barking dogs seldom — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":22,"en":"Hunger is the best sauce.","ko":"배고픔이 최고의 반찬이다.","key":"Hunger is the — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":23,"en":"Practice what you preach.","ko":"말한 대로 행동하라.","key":"Practice what you — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":24,"en":"You get what you pay for.","ko":"싼 게 비지떡이다.","key":"You get what — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":25,"en":"Beggars can't be choosers.","ko":"도움을 받는 처지에 가릴 수는 없다.","key":"Beggars can t — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":26,"en":"Out of sight, out of mind.","ko":"눈에서 멀어지면 마음에서도 멀어진다.","key":"눈(sight)에서 멀어지면 마음(mind)에서도 멀어진다고 짝으로 기억."},{"id":27,"en":"The cat is out of the bag.","ko":"비밀이 드러났다.","key":"가방 속 cat이 밖으로 나오듯 숨긴 비밀도 밖으로 드러남."},{"id":28,"en":"Honesty is the best policy.","ko":"정직이 최선의 방책이다.","key":"Honesty is the — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":29,"en":"Rome wasn't built in a day.","ko":"로마는 하루아침에 이루어지지 않았다.","key":"Rome wasn t — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":30,"en":"Blood is thicker than water.","ko":"피는 물보다 진하다.","key":"가족의 blood가 water보다 thicker(진하다)고 비교."},{"id":31,"en":"It’s the tip of the iceberg.","ko":"빙산의 일각이다.","key":"물 위에는 iceberg의 tip만 보인다는 그림."},{"id":32,"en":"Money doesn't grow on trees.","ko":"돈이 저절로 생기는 것은 아니다.","key":"Money doesn t — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":33,"en":"There is no place like home.","ko":"집만 한 곳은 없다.","key":"There is no — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":34,"en":"Learn to walk before you run.","ko":"기본부터 차근차근 배워라.","key":"Learn to walk — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":35,"en":"Strike while the iron is hot.","ko":"쇠뿔도 단김에 빼라.","key":"iron이 hot할 때 잘 두드려지니 그때 strike."},{"id":36,"en":"The customer is always right.","ko":"고객은 언제나 옳다.","key":"The customer is — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":37,"en":"A burnt child dreads the fire.","ko":"한번 데면 불을 무서워한다.","key":"A burnt child — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":38,"en":"All that glitters is not gold.","ko":"반짝이는 것이 모두 금은 아니다.","key":"반짝인다(glitters)고 전부 gold는 아니라는 반전."},{"id":39,"en":"Laughter is the best medicine.","ko":"웃음이 최고의 약이다.","key":"Laughter is the — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":40,"en":"Make hay while the sun shines.","ko":"기회가 있을 때 활용하라.","key":"Make hay while — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":41,"en":"Slow and steady wins the race.","ko":"천천히 꾸준히 하면 이긴다.","key":"느려도(slow) 꾸준하면(steady) 결국 race를 이김."},{"id":42,"en":"Time and tide wait for no man.","ko":"시간은 아무도 기다려 주지 않는다.","key":"Time and tide — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":43,"en":"What goes around comes around.","ko":"뿌린 대로 돌아온다.","key":"What goes around — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":44,"en":"Too many cooks spoil the broth.","ko":"사공이 많으면 배가 산으로 간다.","key":"Too many cooks — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":45,"en":"Actions speak louder than words.","ko":"말보다 행동이 중요하다.","key":"말(words)보다 행동(actions)이 더 크게 말한다고 비교."},{"id":46,"en":"Don't judge a book by its cover.","ko":"겉모습만 보고 판단하지 마라.","key":"Don t judge — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":47,"en":"If it ain't broke, don't fix it.","ko":"멀쩡한 것은 굳이 고치지 마라.","key":"If it ain — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":48,"en":"The early bird catches the worm.","ko":"일찍 일어나는 새가 벌레를 잡는다.","key":"일찍 나온 bird가 먼저 worm을 잡는 장면."},{"id":49,"en":"A good husband makes a good wife.","ko":"좋은 남편이 좋은 아내를 만든다.","key":"A good husband — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":50,"en":"Man does not live by bread alone.","ko":"사람은 빵만으로 살지 않는다.","key":"Man does not — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":51,"en":"Birds of a feather flock together.","ko":"끼리끼리 모인다.","key":"같은 feather의 새들이 한 flock으로 모이는 장면."},{"id":52,"en":"Empty vessels make the most sound.","ko":"빈 수레가 요란하다.","key":"빈 vessel일수록 부딪힐 때 sound가 크게 난다고 기억."},{"id":53,"en":"It's better to be safe than sorry.","ko":"후회하는 것보다 조심하는 편이 낫다.","key":"It s better — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":54,"en":"The squeaky wheel gets the grease.","ko":"목소리를 내는 사람이 관심을 받는다.","key":"The squeaky wheel — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":55,"en":"When in Rome, do as the Romans do.","ko":"로마에 가면 로마법을 따르라.","key":"Rome에 있으면 Romans가 하는 대로 한다는 장소→행동."},{"id":56,"en":"Where there's smoke, there's fire.","ko":"아니 땐 굴뚝에 연기 나랴.","key":"smoke가 있으면 원인인 fire도 있다고 연결."},{"id":57,"en":"Don't bite the hand that feeds you.","ko":"은혜를 베푸는 사람을 해치지 마라.","key":"Don t bite — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":58,"en":"Good things come to those who wait.","ko":"기다리는 사람에게 좋은 일이 온다.","key":"Good things come — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":59,"en":"The enemy of my enemy is my friend.","ko":"적의 적은 내 친구다.","key":"The enemy of — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":60,"en":"The pen is mightier than the sword.","ko":"펜은 칼보다 강하다.","key":"글과 생각의 pen이 무력의 sword보다 강하다고 비교."},{"id":61,"en":"You can't always get what you want.","ko":"원하는 것을 언제나 얻을 수는 없다.","key":"You can t — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":62,"en":"A friend in need is a friend indeed.","ko":"어려울 때 친구가 진짜 친구다.","key":"A friend in — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":63,"en":"A picture is worth a thousand words.","ko":"백문이 불여일견.","key":"picture 하나가 1000 words만큼 설명한다고 수치로 기억."},{"id":64,"en":"God helps those who help themselves.","ko":"하늘은 스스로 돕는 자를 돕는다.","key":"God helps those — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":65,"en":"A drowning man will catch at a straw.","ko":"물에 빠진 사람은 지푸라기라도 잡는다.","key":"A drowning man — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":66,"en":"Beauty is in the eye of the beholder.","ko":"아름다움은 보는 사람의 눈에 달렸다.","key":"Beauty is in — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":67,"en":"It's no use crying over spilled milk.","ko":"엎질러진 물을 후회해 봐야 소용없다.","key":"It s no — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":68,"en":"Necessity is the mother of invention.","ko":"필요는 발명의 어머니다.","key":"필요(necessity)가 발명(invention)을 낳는 mother."},{"id":69,"en":"A bad workman always blames his tools.","ko":"서투른 일꾼은 연장 탓을 한다.","key":"A bad workman — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":70,"en":"Don't put all your eggs in one basket.","ko":"한 곳에 모든 것을 걸지 마라.","key":"Don t put — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":71,"en":"Where there is a will, there is a way.","ko":"뜻이 있는 곳에 길이 있다.","key":"하려는 will이 있으면 방법 way가 생긴다고 짝으로 기억."},{"id":72,"en":"A man is known by the company he keeps.","ko":"친구를 보면 그 사람을 알 수 있다.","key":"A man is — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":73,"en":"Constant dripping wears away the stone.","ko":"낙숫물이 댓돌을 뚫는다.","key":"작은 dripping도 계속되면 stone을 닳게 함 = 꾸준함."},{"id":74,"en":"There is no such thing as a free lunch.","ko":"세상에 공짜 점심은 없다.","key":"lunch조차 free가 아니라는 말로 ‘공짜는 없다’를 기억."},{"id":75,"en":"Don't make a mountain out of a molehill.","ko":"침소봉대하지 마라.","key":"작은 molehill을 큰 mountain으로 만들지 말라 = 과장 금지."},{"id":76,"en":"When the cat's away, the mice will play.","ko":"고양이가 없으면 쥐들이 날뛴다.","key":"When the cat — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":77,"en":"The apple doesn't fall far from the tree.","ko":"자식은 부모를 닮는다.","key":"apple이 자기 tree 근처에 떨어짐 = 자식은 부모를 닮음."},{"id":78,"en":"The bigger they are, the harder they fall.","ko":"높이 올라갈수록 추락도 크다.","key":"The bigger they — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":79,"en":"All work and no play makes Jack a dull boy.","ko":"일만 하고 놀지 않으면 사람이 무미건조해진다.","key":"All work and — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":80,"en":"If you scratch my back, I'll scratch yours.","ko":"네가 나를 도우면 나도 너를 돕겠다.","key":"If you scratch — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":81,"en":"A bird in the hand is worth two in the bush.","ko":"남의 떡 두 개보다 내 떡 하나가 낫다.","key":"손의 확실한 1마리가 bush의 불확실한 2마리보다 낫다고 비교."},{"id":82,"en":"Don't count your chickens before they hatch.","ko":"김칫국부터 마시지 마라.","key":"알이 hatch하기 전에는 chicken이 확정된 게 아니니 세지 않음."},{"id":83,"en":"Treat others the way you want to be treated.","ko":"남에게 대접받고 싶은 대로 남을 대하라.","key":"Treat others the — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":84,"en":"Hope for the best, but prepare for the worst.","ko":"최선을 기대하되 최악에 대비하라.","key":"마음은 best를 바라되 행동은 worst에 대비한다고 둘로 기억."},{"id":85,"en":"Don't kill the goose that lays the golden eggs.","ko":"황금알을 낳는 거위를 죽이지 마라.","key":"Don t kill — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":86,"en":"Lightning never strikes twice in the same place.","ko":"같은 불행이 같은 곳에 두 번 오지는 않는다.","key":"Lightning never strikes — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":87,"en":"Don't put off until tomorrow what you can do today.","ko":"오늘 할 일을 내일로 미루지 마라.","key":"Don t put — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":88,"en":"If you run after two hares, you will catch neither.","ko":"두 마리 토끼를 쫓으면 둘 다 놓친다.","key":"hares 둘을 동시에 쫓으면 neither, 둘 다 못 잡음."},{"id":89,"en":"You can't make an omelet without breaking a few eggs.","ko":"희생 없이 성과를 얻을 수는 없다.","key":"You can t — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":90,"en":"A journey of a thousand miles begins with a single step.","ko":"천 리 길도 한 걸음부터.","key":"1000 miles도 시작은 single step 하나."},{"id":91,"en":"People who live in glass houses should not throw stones.","ko":"자신에게도 흠이 있다면 남을 비난하지 마라.","key":"People who live — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":92,"en":"The grass is always greener on the other side of the fence.","ko":"남의 것이 더 좋아 보인다.","key":"fence 건너편 grass가 더 greener해 보이는 장면."},{"id":93,"en":"You can lead a horse to water, but you can't make it drink.","ko":"기회는 줄 수 있지만 억지로 행동하게 할 수는 없다.","key":"water까지 데려갈(lead) 수는 있어도 drink는 강요 못 함."},{"id":94,"en":"If you want something done right, you have to do it yourself.","ko":"일을 제대로 하려면 직접 해야 한다.","key":"If you want — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":95,"en":"Give a man a fish and you feed him for a day. Teach a man to fish and you feed him for a lifetime.","ko":"물고기를 주면 하루를 먹이지만 낚시를 가르치면 평생 먹인다.","key":"fish를 주면 day, 잡는 법을 teach하면 lifetime이라고 대비."}];
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById("app"),overlay=document.getElementById("overlay");
let student=null,q=null,answered=false,streak=0,badStreak=0,tripleSeen=false,startedAt=0,timer=null,reviewIds=[];
const mix=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>{s=s||0;let h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}시간 ${m}분`:`${m}분`};
const date=x=>x?new Date(x).toLocaleString("ko-KR"):"-";
function login(){clearInterval(timer);student=null;app.innerHTML=`<div class="login"><h1>English Game</h1><input id="uid" placeholder="ID"><input id="pw" type="password" placeholder="Password"><div id="err" style="height:26px;color:#c33"></div><button id="go" class="primary" style="width:100%">LOGIN</button></div>`;document.getElementById("go").onclick=doLogin}
async function doLogin(){let u=uid.value.trim(),p=pw.value;if(u===TEACHER_ID&&p===TEACHER_PASSWORD){teacher();return}let {data,error}=await db.from("students").select("*").eq("username",u).eq("password",p).maybeSingle();if(error||!data){err.textContent="ID 또는 Password를 확인해 주세요.";return}student=data;startedAt=Date.now();timer=setInterval(saveTime,15000);home()}
async function saveTime(){if(!student||!startedAt)return;let now=Date.now(),add=Math.floor((now-startedAt)/1000);if(add<1)return;student.study_seconds=(student.study_seconds||0)+add;student.last_studied_at=new Date().toISOString();startedAt=now;await db.from("students").update({study_seconds:student.study_seconds,last_studied_at:student.last_studied_at}).eq("id",student.id)}
async function logout(){await saveTime();login()}
window.addEventListener("beforeunload",()=>saveTime());
function home(){let r=student.total_questions?Math.round(student.correct_answers/student.total_questions*100):0;app.innerHTML=`<div class="top"><h1>English Game</h1><button id="logout">LOGOUT</button></div><div class="grid"><div class="stat"><b>${student.total_questions}</b>푼 문제</div><div class="stat"><b>${r}%</b>정답률</div><div class="stat"><b>${fmt(student.study_seconds)}</b>학습시간</div><div class="stat"><b>${student.best_streak||0}</b>최고 연속</div></div><div class="actions"><button id="start" class="primary">START</button><button id="notes">📕 오답노트</button><button id="review">오답 다시 풀기</button></div>`;logout.onclick=logout;start.onclick=()=>{streak=0;badStreak=0;tripleSeen=false;nextQ()};notes.onclick=notebook;review.onclick=startReview}
function nextQ(){answered=false;q=BANK[Math.floor(Math.random()*BANK.length)];let opts=mix([q.en,...mix(BANK.filter(x=>x.id!==q.id)).slice(0,4).map(x=>x.en)]);app.innerHTML=`<div class="top"><b>🔥 ${streak}</b><button id="quit">그만하기</button></div><div class="question">${q.ko}</div><div id="choices"></div><div id="fb"></div><button id="next" class="primary hide">다음 →</button>`;let box=document.getElementById("choices");opts.forEach((x,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=`${i+1}. ${x}`;b.onclick=()=>answer(b,x);box.appendChild(b)});quit.onclick=home;next.onclick=nextQ}
async function answer(btn,x){if(answered)return;answered=true;let ok=x===q.en;student.total_questions++;document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent.slice(b.textContent.indexOf(". ")+2)===q.en)b.classList.add("good")});if(ok){student.correct_answers++;student.score=(student.score||0)+10;streak++;badStreak=0;student.best_streak=Math.max(student.best_streak||0,streak);fb.innerHTML=`<div class="feedback"><b>정답! +10</b></div>`}else{student.wrong_answers++;streak=0;badStreak++;btn.classList.add("bad");fb.innerHTML=`<div class="feedback"><b>${q.en}</b><br>💡 ${q.key}</div>`;let {data}=await db.from("wrong_answers").select("*").eq("student_id",student.id).eq("proverb_id",q.id).maybeSingle();if(data)await db.from("wrong_answers").update({wrong_count:data.wrong_count+1}).eq("id",data.id);else await db.from("wrong_answers").insert({student_id:student.id,proverb_id:q.id,wrong_count:1})}student.last_studied_at=new Date().toISOString();await db.from("students").update({total_questions:student.total_questions,correct_answers:student.correct_answers,wrong_answers:student.wrong_answers,best_streak:student.best_streak,score:student.score,last_studied_at:student.last_studied_at}).eq("id",student.id);next.classList.remove("hide");if(ok&&streak%10===0){student.score+=20;await db.from("students").update({score:student.score}).eq("id",student.id);flash("🔥 10 STREAK!<br>+20 BONUS")}if(!ok&&badStreak>=3){badStreak=0;setTimeout(()=>{if(!tripleSeen){tripleSeen=true;mission(q)}else Math.random()<.5?flash("🚨 정신 차려!<br>3연속 오답"):mission(q)},250)}}
function flash(t){overlay.innerHTML=`<div class="layer"><h1>${t}</h1></div>`;setTimeout(()=>overlay.innerHTML="",1100)}
function mission(item){let w=item.en.split(/\s+/),step=w.length>8?2:1,parts=[];for(let i=0;i<w.length;i+=step)parts.push(w.slice(i,i+step).join(" "));let pos=0,chosen=[];overlay.innerHTML=`<div class="layer"><div><h1>🚨 정신 차려!</h1><p>조각을 순서대로 이어.</p><div class="built" id="built">START</div><div class="tokens" id="tokens"></div></div></div>`;let built=document.getElementById("built"),tokens=document.getElementById("tokens");function draw(){tokens.innerHTML="";mix(parts.map((text,idx)=>({text,idx})).filter(x=>x.idx>=pos)).forEach(o=>{let b=document.createElement("button");b.textContent=o.text;b.onclick=()=>{if(o.idx!==pos)return;chosen.push(o.text);pos++;built.textContent=chosen.join(" ");if(pos===parts.length){tokens.innerHTML="";setTimeout(()=>overlay.innerHTML="",450)}else draw()};tokens.appendChild(b)})}draw()}
async function notebook(){let {data=[]}=await db.from("wrong_answers").select("*").eq("student_id",student.id);let rows=data.map(w=>{let x=BANK.find(b=>b.id===w.proverb_id);return x?`<div class="note"><b>${x.en}</b><div>${x.ko}</div><div class="muted">💡 ${x.key} · ${w.wrong_count}회</div></div>`:""}).join("");app.innerHTML=`<div class="top"><h1>📕 오답노트</h1><button id="exit">나가기</button></div><div class="panel">${rows||"오답이 없어."}</div>`;exit.onclick=home}
async function startReview(){let {data=[]}=await db.from("wrong_answers").select("*").eq("student_id",student.id);reviewIds=mix(data.map(x=>x.proverb_id));if(!reviewIds.length){alert("복습할 오답이 없어!");return}reviewQ()}
function reviewQ(){if(!reviewIds.length){home();return}q=BANK.find(x=>x.id===reviewIds.shift());answered=false;let opts=mix([q.en,...mix(BANK.filter(x=>x.id!==q.id)).slice(0,4).map(x=>x.en)]);app.innerHTML=`<div class="top"><b>오답 복습</b><button id="exit">나가기</button></div><div class="question">${q.ko}</div><div id="choices"></div><div id="fb"></div><button id="next" class="primary hide">다음 →</button>`;let box=document.getElementById("choices");opts.forEach((x,i)=>{let b=document.createElement("button");b.className="choice";b.textContent=`${i+1}. ${x}`;b.onclick=async()=>{if(answered)return;answered=true;let ok=x===q.en;document.querySelectorAll(".choice").forEach(z=>z.disabled=true);if(ok){b.classList.add("good");await db.from("wrong_answers").delete().eq("student_id",student.id).eq("proverb_id",q.id);fb.innerHTML=`<div class="feedback"><b>정답! 오답노트 완료 ✓</b></div>`}else{b.classList.add("bad");fb.innerHTML=`<div class="feedback"><b>${q.en}</b><br>💡 ${q.key}</div>`}next.classList.remove("hide")};box.appendChild(b)});exit.onclick=home;next.onclick=reviewQ}
async function teacher(){let {data=[]}=await db.from("students").select("*").order("username");let rows=data.map(x=>`<tr><td>${x.username}</td><td>${x.password}</td><td>${fmt(x.study_seconds)}</td><td>${x.total_questions}</td><td>${x.correct_answers}</td><td>${x.wrong_answers}</td><td>${x.total_questions?Math.round(x.correct_answers/x.total_questions*100)+"%":"-"}</td><td>${date(x.last_studied_at)}</td></tr>`).join("");app.innerHTML=`<div class="top"><h1>Teacher Dashboard</h1><button id="out">LOGOUT</button></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>비밀번호</th><th>학습시간</th><th>푼 문제</th><th>정답</th><th>오답</th><th>정답률</th><th>마지막 학습</th></tr></thead><tbody>${rows}</tbody></table></div>`;out.onclick=login}
login();
</script></body></html>
