<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Game</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #d8ddea;background:#fff;border-radius:12px;padding:12px 16px}.primary{background:#3048d8;color:#fff;border:0;font-weight:800}.danger{color:#b3261e;border-color:#efb5b0}
#app{min-height:100vh;padding:24px}.wrap{max-width:1180px;margin:auto}.login{max-width:720px;margin:9vh auto;background:#fff;padding:42px;border-radius:24px;box-shadow:0 14px 45px #18213a12}.login input{display:block;width:100%;margin:9px 0;padding:14px;border:1px solid #d8ddea;border-radius:12px}
h1{margin:0 0 22px;font-size:clamp(32px,4vw,48px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card,.panel,.question{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 24px #1720330b}.card b{display:block;font-size:24px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.question{font-size:clamp(23px,3vw,34px);font-weight:850;margin:18px 0}.question small{display:block;font-size:14px;font-weight:500;color:#788195;margin-bottom:8px}.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px}.good{background:#dcf7e5!important}.bad{background:#ffe0e0!important}.feedback{background:#eef1ff;padding:16px;border-radius:14px;margin:15px 0;line-height:1.65}.hide{display:none!important}.note{padding:14px 0;border-bottom:1px solid #e5e9f0}
.layer{position:fixed;inset:0;background:#111827;color:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.layerbox{width:min(850px,95vw)}.built{min-height:64px;border:2px dashed #ffffff70;border-radius:14px;padding:18px;margin:18px 0}.tokens{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.tablewrap{overflow:auto;background:#fff;border-radius:18px;padding:10px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px;border-bottom:1px solid #e6eaf1;text-align:center}tbody tr{cursor:pointer}tbody tr.selected{outline:3px solid #3048d8;outline-offset:-3px}.admin input{width:90px;padding:8px;border:1px solid #ccd2df;border-radius:8px}
@media(max-width:820px){#app{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.login{margin:5vh auto;padding:28px}.top{align-items:flex-start}}
</style></head><body><main id="app"></main><div id="overlay"></div><script>
const BANK=[{"id":1,"en":"No pain, no gain.","ko":"고생 없이는 얻는 것도 없다.","key":"고생(pain)을 해야 얻는 것(gain)이 생긴다고 연결.","level":"easy"},{"id":2,"en":"Haste makes waste.","ko":"급할수록 일을 그르친다.","key":"서두름(haste)이 낭비(waste)를 만든다고 원인→결과로 기억.","level":"easy"},{"id":3,"en":"Easy come, easy go.","ko":"쉽게 얻은 것은 쉽게 잃는다.","key":"쉽게 오면(come) 쉽게 간다(go)는 같은 구조.","level":"easy"},{"id":4,"en":"Ignorance is bliss.","ko":"모르는 게 약이다.","key":"모르면(ignorance) 오히려 마음이 편하다(bliss)는 반전.","level":"easy"},{"id":5,"en":"Knowledge is power.","ko":"아는 것이 힘이다.","key":"아는 것(knowledge) 자체가 힘(power)이 된다고 그대로 연결.","level":"easy"},{"id":6,"en":"Old habits die hard.","ko":"오랜 습관은 고치기 어렵다.","key":"Old habits die — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":7,"en":"Look before you leap.","ko":"행동하기 전에 신중히 생각하라.","key":"뛰기(leap) 전에 먼저 살핀다(look)는 행동 순서.","level":"easy"},{"id":8,"en":"No news is good news.","ko":"소식이 없는 것이 좋은 소식이다.","key":"나쁜 소식조차 없으니 no news를 good news로 연결.","level":"easy"},{"id":9,"en":"Bad news travels fast.","ko":"나쁜 소식은 빨리 퍼진다.","key":"Bad news travels — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":10,"en":"It takes two to tango.","ko":"어떤 일에는 양쪽 모두 책임이 있다.","key":"탱고(tango)는 두 사람이 춰야 하니 양쪽이 필요.","level":"easy"},{"id":11,"en":"Like father, like son.","ko":"그 아버지에 그 아들.","key":"Like father like — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":12,"en":"Still waters run deep.","ko":"조용한 사람이 속이 깊다.","key":"잔잔한 물(still waters)이 오히려 깊다(deep)는 장면.","level":"easy"},{"id":13,"en":"Time heals all wounds.","ko":"시간이 모든 상처를 치유한다.","key":"Time heals all — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":14,"en":"You reap what you sow.","ko":"뿌린 대로 거둔다.","key":"먼저 sow(씨를 뿌리고) 나중에 reap(거둔다)는 순서.","level":"easy"},{"id":15,"en":"Better late than never.","ko":"늦더라도 안 하는 것보다 낫다.","key":"늦게(late)라도 아예 안 하는 것(never)보다 낫다고 비교.","level":"easy"},{"id":16,"en":"History repeats itself.","ko":"역사는 반복된다.","key":"History repeats itself — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":17,"en":"Let bygones be bygones.","ko":"지난 일은 잊어버리자.","key":"Let bygones be — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":18,"en":"Practice makes perfect.","ko":"연습이 완벽을 만든다.","key":"연습(practice)이 완벽(perfect)을 만든다는 원인→결과.","level":"easy"},{"id":19,"en":"Fortune favors the bold.","ko":"행운은 용기 있는 사람의 편이다.","key":"Fortune favors the — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"medium"},{"id":20,"en":"Measure twice, cut once.","ko":"신중히 확인한 후 행동하라.","key":"자르기(cut)는 되돌리기 어려우니 두 번 재고(measure) 한 번 자름.","level":"medium"},{"id":21,"en":"Barking dogs seldom bite.","ko":"짖는 개는 잘 물지 않는다.","key":"Barking dogs seldom — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":22,"en":"Hunger is the best sauce.","ko":"배고픔이 최고의 반찬이다.","key":"Hunger is the — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":23,"en":"Practice what you preach.","ko":"말한 대로 행동하라.","key":"Practice what you — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":24,"en":"You get what you pay for.","ko":"싼 게 비지떡이다.","key":"You get what — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"medium"},{"id":25,"en":"Beggars can't be choosers.","ko":"도움을 받는 처지에 가릴 수는 없다.","key":"Beggars can t — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":26,"en":"Out of sight, out of mind.","ko":"눈에서 멀어지면 마음에서도 멀어진다.","key":"눈(sight)에서 멀어지면 마음(mind)에서도 멀어진다고 짝으로 기억.","level":"easy"},{"id":27,"en":"The cat is out of the bag.","ko":"비밀이 드러났다.","key":"가방 속 cat이 밖으로 나오듯 숨긴 비밀도 밖으로 드러남.","level":"easy"},{"id":28,"en":"Honesty is the best policy.","ko":"정직이 최선의 방책이다.","key":"Honesty is the — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":29,"en":"Rome wasn't built in a day.","ko":"로마는 하루아침에 이루어지지 않았다.","key":"Rome wasn t — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"medium"},{"id":30,"en":"Blood is thicker than water.","ko":"피는 물보다 진하다.","key":"가족의 blood가 water보다 thicker(진하다)고 비교.","level":"medium"},{"id":31,"en":"It’s the tip of the iceberg.","ko":"빙산의 일각이다.","key":"물 위에는 iceberg의 tip만 보인다는 그림.","level":"easy"},{"id":32,"en":"Money doesn't grow on trees.","ko":"돈이 저절로 생기는 것은 아니다.","key":"Money doesn t — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":33,"en":"There is no place like home.","ko":"집만 한 곳은 없다.","key":"There is no — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":34,"en":"Learn to walk before you run.","ko":"기본부터 차근차근 배워라.","key":"Learn to walk — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"medium"},{"id":35,"en":"Strike while the iron is hot.","ko":"쇠뿔도 단김에 빼라.","key":"iron이 hot할 때 잘 두드려지니 그때 strike.","level":"easy"},{"id":36,"en":"The customer is always right.","ko":"고객은 언제나 옳다.","key":"The customer is — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"medium"},{"id":37,"en":"A burnt child dreads the fire.","ko":"한번 데면 불을 무서워한다.","key":"A burnt child — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"medium"},{"id":38,"en":"All that glitters is not gold.","ko":"반짝이는 것이 모두 금은 아니다.","key":"반짝인다(glitters)고 전부 gold는 아니라는 반전.","level":"medium"},{"id":39,"en":"Laughter is the best medicine.","ko":"웃음이 최고의 약이다.","key":"Laughter is the — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":40,"en":"Make hay while the sun shines.","ko":"기회가 있을 때 활용하라.","key":"Make hay while — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"medium"},{"id":41,"en":"Slow and steady wins the race.","ko":"천천히 꾸준히 하면 이긴다.","key":"느려도(slow) 꾸준하면(steady) 결국 race를 이김.","level":"easy"},{"id":42,"en":"Time and tide wait for no man.","ko":"시간은 아무도 기다려 주지 않는다.","key":"Time and tide — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"medium"},{"id":43,"en":"What goes around comes around.","ko":"뿌린 대로 돌아온다.","key":"What goes around — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":44,"en":"Too many cooks spoil the broth.","ko":"사공이 많으면 배가 산으로 간다.","key":"Too many cooks — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"medium"},{"id":45,"en":"Actions speak louder than words.","ko":"말보다 행동이 중요하다.","key":"말(words)보다 행동(actions)이 더 크게 말한다고 비교.","level":"easy"},{"id":46,"en":"Don't judge a book by its cover.","ko":"겉모습만 보고 판단하지 마라.","key":"Don t judge — 한국어 뜻의 장면과 이 순서를 함께 떠올려.","level":"easy"},{"id":47,"en":"If it ain't broke, don't fix it.","ko":"멀쩡한 것은 굳이 고치지 마라.","key":"If const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById("app"),overlay=document.getElementById("overlay");
const SESSION="english_game_session_v7";
let user=null,isTeacher=false,current=null,answered=false,streak=0,wrongStreak=0,firstTriple=true,deck=[],reviewDeck=[],clockStart=0,clockTimer=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const click=(id,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener("click",fn)};
const fmt=s=>{s=Number(s)||0;const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}시간 ${m}분`:`${m}분`};
const dtime=x=>x?new Date(x).toLocaleString("ko-KR"):"-";
function clearHotkeys(){window.onkeydown=null}
function storeSession(v){v?localStorage.setItem(SESSION,JSON.stringify(v)):localStorage.removeItem(SESSION)}
async function flushTime(){if(!user||!clockStart)return;const now=Date.now(),add=Math.floor((now-clockStart)/1000);if(add<1)return;clockStart=now;user.study_seconds=(Number(user.study_seconds)||0)+add;user.last_studied_at=new Date().toISOString();await db.from("students").update({study_seconds:user.study_seconds,last_studied_at:user.last_studied_at}).eq("id",user.id)}
function beginClock(){clearInterval(clockTimer);clockStart=Date.now();clockTimer=setInterval(()=>{if(!document.hidden)flushTime()},15000)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushTime();else if(user)clockStart=Date.now()});

function loginPage(message=""){clearHotkeys();clearInterval(clockTimer);user=null;isTeacher=false;app.innerHTML=`<div class="login"><h1>English Game</h1><input id="loginId" placeholder="ID" autocomplete="username"><input id="loginPw" type="password" placeholder="Password" autocomplete="current-password"><div id="loginError" style="height:28px;color:#b3261e">${message}</div><button id="loginButton" class="primary" style="width:100%">LOGIN</button></div>`;click("loginButton",login);document.getElementById("loginPw").addEventListener("keydown",e=>{if(e.key==="Enter")login()})}
async function login(){const name=document.getElementById("loginId").value.trim(),pw=document.getElementById("loginPw").value;
 if(name===TEACHER_ID&&pw===TEACHER_PASSWORD){isTeacher=true;storeSession({kind:"teacher"});return teacherPage()}
 const {data,error}=await db.from("students").select("*").eq("username",name).eq("password",pw).maybeSingle();
 if(error||!data){document.getElementById("loginError").textContent="ID 또는 Password를 확인해 주세요.";return}
 user=data;storeSession({kind:"student",id:user.id});beginClock();home();
}
async function restoreSession(){let s=null;try{s=JSON.parse(localStorage.getItem(SESSION)||"null")}catch{}
 if(s?.kind==="teacher"){isTeacher=true;return teacherPage()}
 if(s?.kind==="student"){const {data}=await db.from("students").select("*").eq("id",s.id).maybeSingle();if(data){user=data;beginClock();return home()}}
 storeSession(null);loginPage();
}
async function logout(){await flushTime();clearInterval(clockTimer);storeSession(null);user=null;isTeacher=false;loginPage()}

function difficulty(){const n=user.username;if(n==="yezvux")return{easy:.8,simple:false};if(n==="gyuchan")return{easy:.6,simple:false};if(n==="Riizepickme")return{easy:.9,simple:true};if(n==="ktw2012"||n==="gwk0202")return{easy:.3,simple:false};return{easy:.5,simple:false}}
function newDeck(){
 const p=difficulty(),E=shuffle(BANK.filter(x=>x.level==="easy")),M=shuffle(BANK.filter(x=>x.level==="medium")),H=shuffle(BANK.filter(x=>x.level==="hard"));
 // 95 unique questions exactly once. Weighting controls order: preferred group is placed more often early/interleaved.
 let all=shuffle(BANK), easyPreferred=shuffle([...E,...M]), hardPreferred=shuffle([...H,...M]), out=[],used=new Set();
 for(let i=0;i<95;i++){let preferEasy=Math.random()<p.easy,pool=preferEasy?easyPreferred:hardPreferred,x=pool.find(v=>!used.has(v.id))||all.find(v=>!used.has(v.id));if(x){out.push(x);used.add(x.id)}}
 for(const x of BANK)if(!used.has(x.id))out.push(x);
 deck=out;
}
function home(){clearHotkeys();const total=Number(user.total_questions)||0,correct=Number(user.correct_answers)||0,wrong=Number(user.wrong_answers)||0,rate=total?Math.round(correct/total*100):0;
 app.innerHTML=`<div class="wrap"><div class="top"><h1>English Game</h1><button id="logoutButton">LOGOUT</button></div><div class="stats"><div class="card"><b>${fmt(user.study_seconds)}</b>학습시간</div><div class="card"><b>${total}</b>푼 문제</div><div class="card"><b>${correct}</b>정답</div><div class="card"><b>${wrong}</b>오답</div><div class="card"><b>${rate}%</b>정답률</div><div class="card"><b>${user.best_streak||0}</b>최고 연속</div></div><div class="actions"><button id="startButton" class="primary">START</button><button id="wrongNoteButton">📕 오답노트</button><button id="reviewButton">오답 다시 풀기</button></div></div>`;
 click("logoutButton",logout);click("startButton",()=>{streak=0;wrongStreak=0;firstTriple=true;if(!deck.length)newDeck();nextQuestion()});click("wrongNoteButton",wrongNotes);click("reviewButton",startReview);
 if(user.username==="gyuchan")window.onkeydown=e=>{if(e.ctrlKey&&e.key.toLowerCase()==="c"){e.preventDefault();adminPage()}};
}
function optionsFor(q){const count=difficulty().simple?3:5;return shuffle([q,...shuffle(BANK.filter(x=>x.id!==q.id)).slice(0,count-1)])}
function renderQuestion(reviewMode=false){clearHotkeys();answered=false;const options=optionsFor(current);
 app.innerHTML=`<div class="wrap"><div class="top"><b>${reviewMode?"오답 다시 풀기":"🔥 연속 "+streak}</b><button id="leaveButton">${reviewMode?"나가기":"그만하기"}</button></div><div class="question"><small>뜻</small>${current.ko}</div><div id="choiceBox"></div><div class="actions"><button id="hintButton">💡 힌트</button></div><div id="feedback"></div><button id="nextButton" class="primary hide">다음 →</button></div>`;
 const box=document.getElementById("choiceBox");options.forEach((o,i)=>{const b=document.createElement("button");b.className="choice";b.dataset.id=o.id;b.textContent=`${i+1}. ${o.en}`;b.addEventListener("click",()=>reviewMode?reviewAnswer(b,o.id):answer(b,o.id));box.appendChild(b)});
 click("leaveButton",home);click("hintButton",showHint);click("nextButton",reviewMode?nextReview:nextQuestion);
}
function nextQuestion(){if(!deck.length)newDeck();current=deck.shift();renderQuestion(false)}
function showHint(){if(answered)return;const button=document.getElementById("hintButton"),choices=[...document.querySelectorAll(".choice")];
 if(difficulty().simple){shuffle(choices.filter(x=>Number(x.dataset.id)!==current.id)).slice(0,2).forEach(x=>{x.disabled=true;x.style.opacity=".32"});button.textContent="💡 선택지를 줄였어";button.disabled=true;return}
 if(Math.random()<.5){button.textContent="💡 "+current.key;button.disabled=true;setTimeout(()=>{if(button.isConnected){button.textContent="💡 힌트";button.disabled=false}},1000)}
 else{const correct=choices.find(x=>Number(x.dataset.id)===current.id);correct.classList.add("good");button.textContent="💡 하나 맞춰줬어";button.disabled=true;setTimeout(()=>{if(correct.isConnected)correct.classList.remove("good")},1000)}
}
async function answer(button,id){if(answered)return;answered=true;const ok=id===current.id,choices=[...document.querySelectorAll(".choice")];choices.forEach(x=>{x.disabled=true;if(Number(x.dataset.id)===current.id)x.classList.add("good")});
 user.total_questions=(Number(user.total_questions)||0)+1;
 if(ok){user.correct_answers=(Number(user.correct_answers)||0)+1;streak++;wrongStreak=0;user.best_streak=Math.max(Number(user.best_streak)||0,streak);document.getElementById("feedback").innerHTML=`<div class="feedback"><b>정답!</b><br>${current.ko}</div>`}
 else{user.wrong_answers=(Number(user.wrong_answers)||0)+1;streak=0;wrongStreak++;button.classList.add("bad");document.getElementById("feedback").innerHTML=`<div class="feedback"><b>${current.en}</b><br>${current.ko}<br>💡 ${current.key}</div>`;
  const {data}=await db.from("wrong_answers").select("*").eq("student_id",user.id).eq("proverb_id",current.id).maybeSingle();
  if(data)await db.from("wrong_answers").update({wrong_count:(Number(data.wrong_count)||0)+1}).eq("id",data.id);else await db.from("wrong_answers").insert({student_id:user.id,proverb_id:current.id,wrong_count:1});
 }
 await db.from("students").update({total_questions:user.total_questions,correct_answers:user.correct_answers,wrong_answers:user.wrong_answers,best_streak:user.best_streak,last_studied_at:new Date().toISOString()}).eq("id",user.id);
 document.getElementById("nextButton").classList.remove("hide");
 if(ok&&streak%10===0)setTimeout(()=>flash("🔥 10 STREAK!<br>PERFECT RUN"),120);
 if(!ok&&wrongStreak>=3){wrongStreak=0;setTimeout(()=>{if(firstTriple){firstTriple=false;tailGame()}else Math.random()<.5?flash("🚨 정신 차려! 집중!"):tailGame()},160)}
}
function flash(text){overlay.innerHTML=`<div class="layer"><div class="layerbox"><h1>${text}</h1></div></div>`;setTimeout(()=>overlay.innerHTML="",1050)}
function tailGame(){const words=current.en.split(/\s+/),step=difficulty().simple?Math.max(2,Math.ceil(words.length/3)):(words.length>8?2:1),parts=[];for(let i=0;i<words.length;i+=step)parts.push(words.slice(i,i+step).join(" "));
 let pos=0,chosen=[];overlay.innerHTML=`<div class="layer"><div class="layerbox"><h1>꼬리 이어붙이기</h1><p style="font-size:20px">${current.ko}</p><div id="built" class="built">START</div><div id="tokens" class="tokens"></div></div></div>`;
 const built=document.getElementById("built"),tokens=document.getElementById("tokens");function draw(){tokens.innerHTML="";shuffle(parts.map((text,index)=>({text,index})).filter(x=>x.index>=pos)).forEach(x=>{const b=document.createElement("button");b.textContent=x.text;b.addEventListener("click",()=>{if(x.index!==pos)return;chosen.push(x.text);pos++;built.textContent=chosen.join(" ");if(pos===parts.length){tokens.innerHTML="";setTimeout(()=>overlay.innerHTML="",450)}else draw()});tokens.appendChild(b)})}draw()}
async function wrongNotes(){clearHotkeys();const {data=[]}=await db.from("wrong_answers").select("*").eq("student_id",user.id).order("wrong_count",{ascending:false});const rows=data.map(w=>{const x=BANK.find(y=>y.id===w.proverb_id);return x?`<div class="note"><b>${x.en}</b><br>${x.ko}<br>💡 ${x.key} · ${w.wrong_count}회</div>`:""}).join("");
 app.innerHTML=`<div class="wrap"><div class="top"><h1>📕 오답노트</h1><button id="backButton">나가기</button></div><div class="panel">${rows||"오답이 없습니다."}</div></div>`;click("backButton",home)}
async function startReview(){const {data,error}=await db.from("wrong_answers").select("*").eq("student_id",user.id);if(error){alert("오답을 불러오지 못했습니다.");return}reviewDeck=shuffle((data||[]).map(x=>x.proverb_id));if(!reviewDeck.length){alert("복습할 오답이 없습니다.");return}nextReview()}
function nextReview(){if(!reviewDeck.length){home();return}current=BANK.find(x=>x.id===reviewDeck.shift());renderQuestion(true)}
async function reviewAnswer(button,id){if(answered)return;answered=true;const ok=id===current.id;[...document.querySelectorAll(".choice")].forEach(x=>{x.disabled=true;if(Number(x.dataset.id)===current.id)x.classList.add("good")});
 if(ok){await db.from("wrong_answers").delete().eq("student_id",user.id).eq("proverb_id",current.id);document.getElementById("feedback").innerHTML=`<div class="feedback"><b>정답! 오답노트에서 완료 처리했습니다.</b><br>${current.ko}</div>`}
 else{button.classList.add("bad");document.getElementById("feedback").innerHTML=`<div class="feedback"><b>${current.en}</b><br>${current.ko}<br>💡 ${current.key}</div>`}
 document.getElementById("nextButton").classList.remove("hide");
}
async function teacherPage(){clearHotkeys();const {data=[]}=await db.from("students").select("*").order("username");const rows=data.map(x=>`<tr data-id="${x.id}"><td>${x.username}</td><td>${fmt(x.study_seconds)}</td><td>${x.total_questions||0}</td><td>${x.correct_answers||0}</td><td>${x.wrong_answers||0}</td><td>${x.total_questions?Math.round(x.correct_answers/x.total_questions*100)+"%":"-"}</td><td>${x.best_streak||0}</td><td>${dtime(x.last_studied_at)}</td></tr>`).join("");
 app.innerHTML=`<div class="wrap"><div class="top"><h1>Teacher Dashboard</h1><button id="teacherLogout">LOGOUT</button></div><div id="teacherTools" class="actions hide"><button id="addStudent">계정 추가</button><button id="renameStudent">ID 변경</button><button id="changeStudentPw">비밀번호 변경</button><button id="resetStudent">기록 초기화</button><button id="deleteStudent" class="danger">계정 삭제</button></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>학습시간</th><th>푼 문제</th><th>정답</th><th>오답</th><th>정답률</th><th>최고 연속</th><th>마지막 학습</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
 click("teacherLogout",logout);let selected=null;document.querySelectorAll("tbody tr").forEach(r=>r.addEventListener("click",()=>{document.querySelectorAll("tbody tr").forEach(x=>x.classList.remove("selected"));r.classList.add("selected");selected=r.dataset.id}));
 window.onkeydown=e=>{if(e.ctrlKey&&e.key.toLowerCase()==="c"){e.preventDefault();document.getElementById("teacherTools").classList.toggle("hide")}};
 click("addStudent",async()=>{const n=prompt("새 ID");if(!n)return;const p=prompt("새 비밀번호");if(!p)return;const {error}=await db.from("students").insert({username:n,password:p});error?alert(error.message):teacherPage()});
 click("renameStudent",async()=>{if(!selected)return alert("계정을 선택하세요.");const n=prompt("새 ID");if(n){await db.from("students").update({username:n}).eq("id",selected);teacherPage()}});
 click("changeStudentPw",async()=>{if(!selected)return alert("계정을 선택하세요.");const p=prompt("새 비밀번호");if(p){await db.from("students").update({password:p}).eq("id",selected);teacherPage()}});
 click("resetStudent",async()=>{if(!selected)return alert("계정을 선택하세요.");if(confirm("기록을 초기화할까요?")){await db.from("wrong_answers").delete().eq("student_id",selected);await db.from("students").update({study_seconds:0,total_questions:0,correct_answers:0,wrong_answers:0,best_streak:0,last_studied_at:null}).eq("id",selected);teacherPage()}});
 click("deleteStudent",async()=>{if(!selected)return alert("계정을 선택하세요.");if(confirm("정말 삭제할까요?")){const {error}=await db.from("students").delete().eq("id",selected);error?alert(error.message):teacherPage()}});
}
async function adminPage(){clearHotkeys();const {data=[]}=await db.from("students").select("*").order("username");const rows=data.map(x=>`<tr data-id="${x.id}"><td>${x.username}</td>${["study_seconds","total_questions","correct_answers","wrong_answers","best_streak"].map(k=>`<td><input data-key="${k}" value="${x[k]||0}"></td>`).join("")}<td><button class="saveRow">저장</button></td></tr>`).join("");
 app.innerHTML=`<div class="wrap admin"><div class="top"><h1>Admin</h1><button id="adminBack">돌아가기</button></div><div class="actions"><button id="teacherPassword">선생님 비밀번호 변경</button></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>학습초</th><th>푼 문제</th><th>정답</th><th>오답</th><th>최고 연속</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
 click("adminBack",home);click("teacherPassword",()=>alert("선생님 비밀번호 변경은 config.js의 TEACHER_PASSWORD를 변경하면 됩니다."));
 document.querySelectorAll(".saveRow").forEach(b=>b.addEventListener("click",async()=>{const tr=b.closest("tr"),values={};tr.querySelectorAll("input").forEach(i=>values[i.dataset.key]=Math.max(0,parseInt(i.value)||0));const {error}=await db.from("students").update(values).eq("id",tr.dataset.id);if(error)alert(error.message);else{if(user.id===tr.dataset.id)Object.assign(user,values);alert("저장했습니다.")}}));
}
restoreSession();
</script></body></html>
