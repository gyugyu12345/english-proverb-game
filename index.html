<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,"Noto Sans KR",sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #d9deea;background:white;border-radius:12px;padding:12px 16px}button.primary{background:#3448d8;color:#fff;border:0;font-weight:800}.danger{color:#b42318}.hide{display:none!important}#app{min-height:100vh;padding:22px}.wrap{max-width:1180px;margin:auto}.login{max-width:620px;margin:10vh auto;background:#fff;padding:38px;border-radius:22px;box-shadow:0 12px 40px #11182712}.login input{width:100%;display:block;margin:10px 0;padding:14px;border:1px solid #d9deea;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:18px 0}.card,.panel,.question{background:#fff;border-radius:17px;padding:17px;box-shadow:0 5px 20px #1118270a}.card b{display:block;font-size:21px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.question{font-size:clamp(22px,3vw,34px);font-weight:800;margin:18px 0}.question small{display:block;font-size:13px;color:#7a8498;margin-bottom:8px}.choice{width:100%;display:block;text-align:left;margin:8px 0;padding:14px}.good{background:#dff7e7}.bad{background:#ffe0e0}.feedback{background:#eef1ff;padding:15px;border-radius:13px;margin:14px 0;line-height:1.6}.note{padding:12px 0;border-bottom:1px solid #e6eaf1}.layer{position:fixed;inset:0;background:#111827;color:#fff;z-index:999;display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}.layerbox{width:min(820px,96vw)}.built{min-height:62px;border:2px dashed #ffffff70;border-radius:13px;padding:17px;margin:18px 0}.tokens{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.tablewrap{overflow:auto;background:#fff;border-radius:17px;padding:8px}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:11px;border-bottom:1px solid #e7eaf1;text-align:center}.mainrow{cursor:pointer}.selected{outline:3px solid #3448d8;outline-offset:-3px}.detailbox{text-align:left}.admin input{width:88px;padding:7px;border:1px solid #ccd2df;border-radius:8px}.admin input.idinput{width:140px}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.bell{position:relative;font-size:23px;padding:9px 13px}.badge{position:absolute;right:-5px;top:-6px;background:#d92d20;color:white;border-radius:99px;font-size:11px;padding:2px 6px}
.pop{position:absolute;right:22px;top:72px;width:min(480px,90vw);max-height:65vh;overflow:auto;background:#fff;border:1px solid #dde2ec;border-radius:16px;padding:14px;box-shadow:0 16px 45px #11182728;z-index:50}

</style></head><body><main id="app"></main><div id="overlay"></div><script>
const BANK=[{"id":1,"en":"No pain, no gain.","ko":"고생 없이는 얻는 것도 없다.","key":"고생(pain)을 해야 얻는 것(gain)이 생긴다고 연결."},{"id":2,"en":"Haste makes waste.","ko":"급할수록 일을 그르친다.","key":"서두름(haste)이 낭비(waste)를 만든다고 원인→결과로 기억."},{"id":3,"en":"Easy come, easy go.","ko":"쉽게 얻은 것은 쉽게 잃는다.","key":"쉽게 오면(come) 쉽게 간다(go)는 같은 구조."},{"id":4,"en":"Ignorance is bliss.","ko":"모르는 게 약이다.","key":"모르면(ignorance) 오히려 마음이 편하다(bliss)는 반전."},{"id":5,"en":"Knowledge is power.","ko":"아는 것이 힘이다.","key":"아는 것(knowledge) 자체가 힘(power)이 된다고 그대로 연결."},{"id":6,"en":"Old habits die hard.","ko":"오랜 습관은 고치기 어렵다.","key":"Old habits die — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":7,"en":"Look before you leap.","ko":"행동하기 전에 신중히 생각하라.","key":"뛰기(leap) 전에 먼저 살핀다(look)는 행동 순서."},{"id":8,"en":"No news is good news.","ko":"소식이 없는 것이 좋은 소식이다.","key":"나쁜 소식조차 없으니 no news를 good news로 연결."},{"id":9,"en":"Bad news travels fast.","ko":"나쁜 소식은 빨리 퍼진다.","key":"Bad news travels — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":10,"en":"It takes two to tango.","ko":"어떤 일에는 양쪽 모두 책임이 있다.","key":"탱고(tango)는 두 사람이 춰야 하니 양쪽이 필요."},{"id":11,"en":"Like father, like son.","ko":"그 아버지에 그 아들.","key":"Like father like — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":12,"en":"Still waters run deep.","ko":"조용한 사람이 속이 깊다.","key":"잔잔한 물(still waters)이 오히려 깊다(deep)는 장면."},{"id":13,"en":"Time heals all wounds.","ko":"시간이 모든 상처를 치유한다.","key":"Time heals all — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":14,"en":"You reap what you sow.","ko":"뿌린 대로 거둔다.","key":"먼저 sow(씨를 뿌리고) 나중에 reap(거둔다)는 순서."},{"id":15,"en":"Better late than never.","ko":"늦더라도 안 하는 것보다 낫다.","key":"늦게(late)라도 아예 안 하는 것(never)보다 낫다고 비교."},{"id":16,"en":"History repeats itself.","ko":"역사는 반복된다.","key":"History repeats itself — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":17,"en":"Let bygones be bygones.","ko":"지난 일은 잊어버리자.","key":"Let bygones be — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":18,"en":"Practice makes perfect.","ko":"연습이 완벽을 만든다.","key":"연습(practice)이 완벽(perfect)을 만든다는 원인→결과."},{"id":19,"en":"Fortune favors the bold.","ko":"행운은 용기 있는 사람의 편이다.","key":"Fortune favors the — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":20,"en":"Measure twice, cut once.","ko":"신중히 확인한 후 행동하라.","key":"자르기(cut)는 되돌리기 어려우니 두 번 재고(measure) 한 번 자름."},{"id":21,"en":"Barking dogs seldom bite.","ko":"짖는 개는 잘 물지 않는다.","key":"Barking dogs seldom — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":22,"en":"Hunger is the best sauce.","ko":"배고픔이 최고의 반찬이다.","key":"Hunger is the — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":23,"en":"Practice what you preach.","ko":"말한 대로 행동하라.","key":"Practice what you — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":24,"en":"You get what you pay for.","ko":"싼 게 비지떡이다.","key":"You get what — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":25,"en":"Beggars can't be choosers.","ko":"도움을 받는 처지에 가릴 수는 없다.","key":"Beggars can t — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":26,"en":"Out of sight, out of mind.","ko":"눈에서 멀어지면 마음에서도 멀어진다.","key":"눈(sight)에서 멀어지면 마음(mind)에서도 멀어진다고 짝으로 기억."},{"id":27,"en":"The cat is out of the bag.","ko":"비밀이 드러났다.","key":"가방 속 cat이 밖으로 나오듯 숨긴 비밀도 밖으로 드러남."},{"id":28,"en":"Honesty is the best policy.","ko":"정직이 최선의 방책이다.","key":"Honesty is the — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":29,"en":"Rome wasn't built in a day.","ko":"로마는 하루아침에 이루어지지 않았다.","key":"Rome wasn t — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":30,"en":"Blood is thicker than water.","ko":"피는 물보다 진하다.","key":"가족의 blood가 water보다 thicker(진하다)고 비교."},{"id":31,"en":"It’s the tip of the iceberg.","ko":"빙산의 일각이다.","key":"물 위에는 iceberg의 tip만 보인다는 그림."},{"id":32,"en":"Money doesn't grow on trees.","ko":"돈이 저절로 생기는 것은 아니다.","key":"Money doesn t — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":33,"en":"There is no place like home.","ko":"집만 한 곳은 없다.","key":"There is no — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":34,"en":"Learn to walk before you run.","ko":"기본부터 차근차근 배워라.","key":"Learn to walk — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":35,"en":"Strike while the iron is hot.","ko":"쇠뿔도 단김에 빼라.","key":"iron이 hot할 때 잘 두드려지니 그때 strike."},{"id":36,"en":"The customer is always right.","ko":"고객은 언제나 옳다.","key":"The customer is — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":37,"en":"A burnt child dreads the fire.","ko":"한번 데면 불을 무서워한다.","key":"A burnt child — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":38,"en":"All that glitters is not gold.","ko":"반짝이는 것이 모두 금은 아니다.","key":"반짝인다(glitters)고 전부 gold는 아니라는 반전."},{"id":39,"en":"Laughter is the best medicine.","ko":"웃음이 최고의 약이다.","key":"Laughter is the — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":40,"en":"Make hay while the sun shines.","ko":"기회가 있을 때 활용하라.","key":"Make hay while — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":41,"en":"Slow and steady wins the race.","ko":"천천히 꾸준히 하면 이긴다.","key":"느려도(slow) 꾸준하면(steady) 결국 race를 이김."},{"id":42,"en":"Time and tide wait for no man.","ko":"시간은 아무도 기다려 주지 않는다.","key":"Time and tide — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":43,"en":"What goes around comes around.","ko":"뿌린 대로 돌아온다.","key":"What goes around — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":44,"en":"Too many cooks spoil the broth.","ko":"사공이 많으면 배가 산으로 간다.","key":"Too many cooks — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":45,"en":"Actions speak louder than words.","ko":"말보다 행동이 중요하다.","key":"말(words)보다 행동(actions)이 더 크게 말한다고 비교."},{"id":46,"en":"Don't judge a book by its cover.","ko":"겉모습만 보고 판단하지 마라.","key":"Don t judge — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":47,"en":"If it ain't broke, don't fix it.","ko":"멀쩡한 것은 굳이 고치지 마라.","key":"If it ain — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":48,"en":"The early bird catches the worm.","ko":"일찍 일어나는 새가 벌레를 잡는다.","key":"일찍 나온 bird가 먼저 worm을 잡는 장면."},{"id":49,"en":"A good husband makes a good wife.","ko":"좋은 남편이 좋은 아내를 만든다.","key":"A good husband — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":50,"en":"Man does not live by bread alone.","ko":"사람은 빵만으로 살지 않는다.","key":"Man does not — 한국어 뜻의 장면과 이 순서를 함께 떠올려."},{"id":51,"en":"Birds of a feather flock together.","ko":"끼리끼리 모인다.","key":"같은 feather의 새들이 한 flock으로 모이는 장면."},{"id":52,"en":"Empty vessels make the most sound.","ko":"빈 수레가 요란하다.","key":"빈 vessel일수록 부딪힐 때 sound가 크게 난다고 기억."},{"id":53,"en":"It's better to be safe than sorry.","ko":"후회하는 것보다 조심하는 편이 낫다.","key":"It function tail(){let words=q.en.split(/\s+/),step=u.username==="Riizepickme"?Math.max(2,Math.ceil(words.length/3)):(words.length>8?2:1),parts=[];for(let i=0;i<words.length;i+=step)parts.push(words.slice(i,i+step).join(" "));let pos=0,got=[];overlay.innerHTML=`<div class=layer><div class=layerbox><h1>꼬리 이어붙이기</h1><p style="font-size:20px">${q.ko}</p><div id=built class=built>START</div><div id=tokens class=tokens></div><div class=actions style="justify-content:center"><button id=hint>💡 힌트</button></div></div></div>`;let built=document.getElementById("built"),tokens=document.getElementById("tokens"),h=document.getElementById("hint");function accept(){got.push(parts[pos]);pos++;built.textContent=got.join(" ");if(pos===parts.length){tokens.innerHTML="";h.disabled=true;setTimeout(()=>overlay.innerHTML="",450)}else draw()}function draw(){tokens.innerHTML="";mix(parts.map((text,i)=>({text,i})).filter(x=>x.i>=pos)).forEach(x=>{let b=document.createElement("button");b.textContent=x.text;b.onclick=()=>{if(x.i===pos)accept()};tokens.appendChild(b)})}h.onclick=()=>{if(pos>=parts.length)return;if(Math.random()<.5){let old=h.textContent;h.textContent="💡 "+parts[pos];h.disabled=true;setTimeout(()=>{if(h.isConnected){h.textContent=old;h.disabled=false}},1000)}else accept()};draw()}
async function notes(){keysOff();let {data=[]}=await db.from("wrong_answers").select("*").eq("student_id",u.id).order("wrong_count",{ascending:false});app.innerHTML=`<div class=wrap><div class=top><h1>📕 오답노트</h1><button id=back>나가기</button></div><div class=panel>${data.map(w=>{let x=BANK.find(y=>y.id===w.proverb_id);return x?`<div class=note><b>${x.en}</b><br>${x.ko}<br>💡 ${x.key}<br>오답 ${w.wrong_count}회</div>`:""}).join("")||"오답이 없습니다."}</div></div>`;on("back",home)}

async function reviewAns(btn,id){if(answered)return;answered=true;let ok=id===q.id;lastAnswerAt=Date.now();sessionQuestionStart=Date.now();document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(+b.dataset.id===q.id)b.classList.add("good")});if(ok){await db.from("wrong_answers").delete().eq("student_id",u.id).eq("proverb_id",q.id);fb.innerHTML=`<div class=feedback><b>정답! 오답노트에서 완료 처리했습니다.</b></div>`}else{btn.classList.add("bad");fb.innerHTML=`<div class=feedback><b>${q.en}</b><br>${q.ko}<br>💡 ${q.key}</div>`}nxt.classList.remove("hide")}
async function teacher(){keysOff();let {data=[]}=await db.from("students").select("*").order("username");let today=new Date();today.setHours(0,0,0,0);let {data:todayS=[]}=await db.from("study_sessions").select("*").gte("started_at",today.toISOString());let active=data.filter(x=>x.active_session_token).length,totalToday=todayS.reduce((a,x)=>a+(+x.study_seconds||0),0),studied=new Set(todayS.map(x=>x.student_id)).size;let {data:alerts=[]}=await db.from("student_events").select("*,students(username)").in("event_type",["inactivity_logout","focus_leave","duplicate_login","wrong_streak","high_wrong_rate"]).order("created_at",{ascending:false}).limit(20);let rows=data.map(x=>`<tr class=mainrow data-id="${x.id}"><td>${x.username}</td><td>${fmt(x.study_seconds)}</td><td>${x.total_questions||0}</td><td>${x.correct_answers||0}</td><td>${x.wrong_answers||0}</td><td>${x.total_questions?Math.round(x.correct_answers/x.total_questions*100)+"%":"-"}</td><td>${x.best_streak||0}</td><td>${dt(x.last_studied_at)}</td><td><button class=exp data-id="${x.id}">›</button></td></tr><tr id=d${x.id} class=hide><td colspan=9><div class=detailbox></div></td></tr>`).join("");app.innerHTML=`<div class=wrap><div class=top><h1>Teacher Dashboard</h1><button id=lo>LOGOUT</button></div><div class=summary><div class=card><b>${studied}</b>오늘 학습한 학생</div><div class=card><b>${active}</b>현재 접속</div><div class=card><b>${fmt(totalToday)}</b>오늘 총 학습</div><div class=card><b>${alerts.length}</b>확인 알림</div></div><div class=panel><b>최근 확인 필요 알림</b>${alerts.slice(0,6).map(a=>`<div class=alertrow>${a.event_message||a.event_type}<div class=muted>${dt(a.created_at)}</div></div>`).join("")||"<div class=note>알림이 없습니다.</div>"}</div><div id=tools class="actions hide"><button id=add>학생 추가</button><button id=rename>ID 변경</button><button id=spw>비밀번호 변경</button><button id=reset>기록 초기화</button><button id=del class=danger>학생 삭제</button></div><div class=tablewrap style="margin-top:18px"><table><thead><tr><th>ID</th><th>학습시간</th><th>푼 문제</th><th>정답</th><th>오답</th><th>정답률</th><th>최고연속</th><th>마지막 학습</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;on("lo",()=>{saveLogin(null);loginPage()});let sel=null;document.querySelectorAll(".mainrow").forEach(r=>r.onclick=()=>{document.querySelectorAll(".mainrow").forEach(x=>x.classList.remove("selected"));r.classList.add("selected");sel=r.dataset.id});document.querySelectorAll(".exp").forEach(b=>b.onclick=async e=>{e.stopPropagation();let r=document.getElementById("d"+b.dataset.id);if(!r.classList.contains("hide"))return r.classList.add("hide");let {data=[]}=await db.from("study_sessions").select("*").eq("student_id",b.dataset.id).order("started_at",{ascending:false}).limit(50);r.querySelector(".detailbox").innerHTML=data.length?data.map(v=>`<div class=note><b>${dt(v.started_at)}</b> 시작 → ${v.ended_at?dt(v.ended_at):"진행 중"} · ${fmt(v.study_seconds)} · ${v.questions}문제 · 정답 ${v.correct} · 오답 ${v.wrong}${v.logout_reason?` · ${v.logout_reason}`:""}</div>`).join(""):"학습 이력이 없습니다.";r.classList.remove("hide")});window.onkeydown=e=>{if(e.ctrlKey&&e.key.toLowerCase()==="c"){e.preventDefault();tools.classList.toggle("hide")}};on("add",async()=>{let n=prompt("새 ID"),p=n&&prompt("새 비밀번호");if(n&&p){let {error}=await db.from("students").insert({username:n,password:p,easy_ratio:50});error?alert(error.message):teacher()}});on("rename",async()=>{if(!sel)return alert("학생을 선택하세요.");let n=prompt("새 ID");if(n){await db.from("students").update({username:n}).eq("id",sel);teacher()}});on("spw",async()=>{if(!sel)return alert("학생을 선택하세요.");let p=prompt("새 비밀번호");if(p){await db.from("students").update({password:p}).eq("id",sel);teacher()}});on("reset",async()=>{if(sel&&confirm("기록을 초기화할까요?")){await db.from("wrong_answers").delete().eq("student_id",sel);await db.from("study_sessions").delete().eq("student_id",sel);await db.from("student_events").delete().eq("student_id",sel);await db.from("students").update({study_seconds:0,total_questions:0,correct_answers:0,wrong_answers:0,best_streak:0,last_studied_at:null,last_answered_at:null}).eq("id",sel);teacher()}});on("del",async()=>{if(sel&&confirm("학생을 삭제할까요?")){let {error}=await db.from("students").delete().eq("id",sel);error?alert(error.message):teacher()}})}
async function admin(){keysOff();let {data=[]}=await db.from("students").select("*").order("username"),rows=data.map(x=>`<tr data-id="${x.id}"><td><input class=idinput data-k=username value="${x.username}"></td><td><input data-k=easy_ratio value="${x.easy_ratio??50}">%</td><td><input data-k=study_seconds value="${x.study_seconds||0}"></td><td><input data-k=total_questions value="${x.total_questions||0}"></td><td><input data-k=correct_answers value="${x.correct_answers||0}"></td><td><input data-k=wrong_answers value="${x.wrong_answers||0}"></td><td><input data-k=best_streak value="${x.best_streak||0}"></td><td><button class=save>저장</button> <button class=pw>비번</button> <button class=wa>오답</button> <button class=delA>삭제</button></td></tr>`).join("");app.innerHTML=`<div class="wrap admin"><div class=top><h1>Admin</h1><div><button id=bell class=bell>🔔<span id=badge class="badge hide"></span></button> <button id=back>돌아가기</button></div></div><div id=pop class="pop hide"></div><div class=actions><button id=addA>학생 추가</button><button id=tpw>선생님 비밀번호 변경</button></div><div class=tablewrap><table><thead><tr><th>ID</th><th>쉬움%</th><th>학습초</th><th>푼문제</th><th>정답</th><th>오답</th><th>최고연속</th><th>관리</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;on("back",home);(async()=>{let {data:aa=[]}=await db.from("student_events").select("*,students(username)").order("created_at",{ascending:false}).limit(50);let unread=aa.filter(x=>!x.admin_read).length,b=document.getElementById("badge");if(unread){b.textContent=unread;b.classList.remove("hide")}on("bell",async()=>{let p=document.getElementById("pop");p.innerHTML=`<b>학생 학습 알림</b>${aa.map(a=>`<div class=alertrow><b>${a.students?.username||""}</b> · ${a.event_message||a.event_type}<div class=muted>${dt(a.created_at)}</div></div>`).join("")||"<div class=note>알림이 없습니다.</div>"} `;p.classList.toggle("hide");await db.from("student_events").update({admin_read:true}).eq("admin_read",false);b.classList.add("hide")})})();on("addA",async()=>{let n=prompt("새 ID"),p=n&&prompt("새 비밀번호");if(n&&p){await db.from("students").insert({username:n,password:p,easy_ratio:50});admin()}});on("tpw",async()=>{let p=prompt("새 선생님 비밀번호");if(p){let {error}=await db.from("teacher_account").update({password:p,updated_at:new Date().toISOString()}).eq("id",1);error?alert(error.message):alert("변경했습니다.")}});document.querySelectorAll(".save").forEach(b=>b.onclick=async()=>{let r=b.closest("tr"),v={};r.querySelectorAll("input").forEach(i=>v[i.dataset.k]=i.dataset.k==="username"?i.value.trim():Math.max(0,parseInt(i.value)||0));v.easy_ratio=Math.min(100,v.easy_ratio);let {error}=await db.from("students").update(v).eq("id",r.dataset.id);if(error)alert(error.message);else{if(+r.dataset.id===+u.id)Object.assign(u,v);alert("저장했습니다.")}});document.querySelectorAll(".pw").forEach(b=>b.onclick=async()=>{let p=prompt("새 비밀번호");if(p){await db.from("students").update({password:p}).eq("id",b.closest("tr").dataset.id);alert("변경했습니다.")}});document.querySelectorAll(".delA").forEach(b=>b.onclick=async()=>{if(confirm("삭제할까요?")){await db.from("students").delete().eq("id",b.closest("tr").dataset.id);admin()}});document.querySelectorAll(".wa").forEach(b=>b.onclick=async()=>{let id=b.closest("tr").dataset.id,{data=[]}=await db.from("wrong_answers").select("*").eq("student_id",id);let text=data.map(w=>{let x=BANK.find(z=>z.id===w.proverb_id);return x?`${x.en} (${w.wrong_count}회)`:""}).filter(Boolean).join("\n");if(confirm((text||"오답 없음")+"\n\n이 학생의 오답을 모두 지울까요?")){await db.from("wrong_answers").delete().eq("student_id",id);alert("삭제했습니다.")}})}
